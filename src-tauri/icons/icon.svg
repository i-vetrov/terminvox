<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- TerminVox: a terminal prompt next to a theremin antenna that is "calling" (amber = needs you) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34363d"/>
      <stop offset="1" stop-color="#16171b"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a9ea8"/>
      <stop offset="0.5" stop-color="#e4e6ea"/>
      <stop offset="1" stop-color="#9a9ea8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- macOS icon grid: 824px squircle-ish tile centered in 1024 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <!-- prompt >_ -->
  <g fill="none" stroke="#eceef1" stroke-width="54" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="232,548 352,632 232,716"/>
    <line x1="410" y1="716" x2="520" y2="716"/>
  </g>

  <!-- theremin: cabinet + vertical pitch antenna -->
  <rect x="600" y="650" width="190" height="78" rx="20" fill="#4a4d56"/>
  <rect x="600" y="650" width="190" height="20" rx="10" fill="#5d616b"/>
  <rect x="679" y="300" width="32" height="356" rx="16" fill="url(#metal)"/>
  <circle cx="695" cy="300" r="25" fill="#eceef1"/>

  <!-- amber sound waves (glow + crisp) -->
  <g fill="none" stroke="#f2c55c" stroke-linecap="round" stroke-width="26">
    <g filter="url(#glow)" opacity="0.55">
      <path d="M 745 250 A 70 70 0 0 1 745 350"/>
      <path d="M 785 205 A 130 130 0 0 1 785 395"/>
      <path d="M 825 160 A 190 190 0 0 1 825 440"/>
    </g>
    <path d="M 745 250 A 70 70 0 0 1 745 350"/>
    <path d="M 785 205 A 130 130 0 0 1 785 395" opacity="0.75"/>
    <path d="M 825 160 A 190 190 0 0 1 825 440" opacity="0.45"/>
  </g>
</svg>
